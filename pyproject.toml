[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mindlas"
version = "0.1.2"
description = "Mindlas — the live reliability instrument for coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Evolutionairy AI" }]
keywords = ["claude-code", "agents", "reliability", "observability", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Evolutionairy-AI/MINDLAS"
Repository = "https://github.com/Evolutionairy-AI/MINDLAS"
Issues = "https://github.com/Evolutionairy-AI/MINDLAS/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mindlas = "mindlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindlas"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "docs/", "hooks/", "commands/", ".claude-plugin/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
# tests set sys.path/env before imports and use compact one-line asserts by convention
"tests/*" = ["E402", "E702", "E401", "E741", "F811"]
